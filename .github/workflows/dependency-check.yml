name: Dependency sanity checker

on:
  push:
    branches: [ main, release/** ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dependency-sanity-checker:
    # Pinned to the Build matrix image so the cgo libs build the same and share its cache.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - uses: stellar/actions/rust-cache@main
      - uses: ./.github/actions/setup-go
        with:
          internal-go-modules-app-id: ${{ vars.INTERNAL_GO_MODULES_APP_ID }}
          internal-go-modules-private-key: ${{ secrets.INTERNAL_GO_MODULES_APP_PRIVATE_KEY }}
      - run: scripts/check-dependencies.bash

  validate-rust-git-rev-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stellar/actions/rust-check-git-rev-deps@main
