name: Stellar RPC

defaults:
  run:
    shell: bash

on:
  pull_request:
  push:
    branches: [ main, release/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull requests, build and test the PR head not a merge of the PR with the destination.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # We need to full history for git-restore-mtime to know what modification dates to use.
          # Otherwise, the Go test cache will fail (due to the modification time of fixtures changing).
          fetch-depth: "0"
      - uses: ./.github/actions/setup-go
      - run: rustup update
      - uses: stellar/actions/rust-cache@main
      - run: make build-libs
      - run: go test -race -timeout 25m ./cmd/stellar-rpc/...

  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            go_arch: amd64
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            go_arch: arm64
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            go_arch: amd64
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            go_arch: arm64
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnu
            go_arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go

      # Use cross-compiler for linux aarch64
      - if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        name: Install aarch64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-10-aarch64-linux-gnu
          echo 'CC=aarch64-linux-gnu-gcc-10' >> $GITHUB_ENV

      - run: |
          rustup target add ${{ matrix.rust_target }}
          rustup update
      - uses: stellar/actions/rust-cache@main
      - run: make build-libs
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}

      - name: Build Stellar RPC reproducible build
        run: |
          go build -trimpath -buildvcs=false ./cmd/stellar-rpc
          ls -lh stellar-rpc
          file stellar-rpc
        env:
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.go_arch }}

  integration-p29-pkg:
    name: Integration tests (P29)
    uses: ./.github/workflows/integration-tests.yml
    with:
      protocol_version: '29'
      # stellar-core 29.0.0: its src/rust/soroban/p29 is rs-soroban-env v29.0.0
      # (a721944b), the commit soroban-env-host-prev pins.
      core_deb_version: '29.0.0-3589.4eb833373.noble'
      core_docker_img: 'stellar/stellar-core:29.0.0-3589.4eb833373.noble'

  integration-p30-pkg:
    name: Integration tests (P30)
    uses: ./.github/workflows/integration-tests.yml
    with:
      protocol_version: '30'
      # No stellar-core build implements all of protocol 30 yet. This is the
      # vnext build of master at 88d2431d7, whose p30 host is rs-soroban-env
      # fddfd567: CAP-0084, but neither CAP-0087 (the ML-DSA host functions
      # soroban-env-host-curr 8abed902 adds) nor CAP-0088. Move to a build
      # with stellar-core #5455/#5478 and #5423 once one is published.
      core_deb_version: '29.0.1-3630.88d2431d7.noble~vnext'
      core_docker_img: 'stellar/unsafe-stellar-core:29.0.1-3630.88d2431d7.noble-vnext'

  # integration-p25-src:
  #   name: Integration tests (p25, core from source)
  #   uses: ./.github/workflows/integration-tests.yml
  #   with:
  #     protocol_version: '25'
  #     core_git_ref: 'master'
