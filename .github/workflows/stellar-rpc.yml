name: Stellar RPC

defaults:
  run:
    shell: bash

on:
  pull_request:
  push:
    branches: [ main, release/** ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull requests, build and test the PR head not a merge of the PR with the destination.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # We need to full history for git-restore-mtime to know what modification dates to use.
          # Otherwise, the Go test cache will fail (due to the modification time of fixtures changing).
          fetch-depth: "0"
      - uses: ./.github/actions/setup-go
      - run: rustup update
      - uses: stellar/actions/rust-cache@main
      - run: make build-libs
      - run: go test -race -timeout 25m ./cmd/stellar-rpc/...

  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            go_arch: amd64
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            go_arch: arm64
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            go_arch: amd64
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            go_arch: arm64
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnu
            go_arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go

      # Use cross-compiler for linux aarch64
      - if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        name: Install aarch64 cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-10-aarch64-linux-gnu
          echo 'CC=aarch64-linux-gnu-gcc-10' >> $GITHUB_ENV

      - run: |
          rustup target add ${{ matrix.rust_target }}
          rustup update
      - uses: stellar/actions/rust-cache@main
      - run: make build-libs
        env:
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}

      - name: Build Stellar RPC reproducible build
        run: |
          go build -trimpath -buildvcs=false ./cmd/stellar-rpc
          ls -lh stellar-rpc
          file stellar-rpc
        env:
          CGO_ENABLED: 1
          GOARCH: ${{ matrix.go_arch }}

  integration-p29-pkg:
    name: Integration tests (P29)
    uses: ./.github/workflows/integration-tests.yml
    with:
      protocol_version: '29'
      # stellar-core master (#5476 merged, 88d2431d) without vnext: its p29
      # host is rs-soroban-env a721944b, the same commit soroban-env-host-prev
      # pins.
      core_deb_version: '29.0.1-3629.88d2431d7.noble'
      core_docker_img: 'stellar/unsafe-stellar-core:29.0.1-3629.88d2431d7.noble'

  integration-p30-src:
    name: Integration tests (P30)
    uses: ./.github/workflows/integration-tests.yml
    with:
      protocol_version: '30'
      # core #5455 (unmerged) repins the p30 vnext host to rs-soroban-env
      # f5a9fb79 (CAP-0087), the commit soroban-env-host-curr pins. No -vnext
      # package carries that pin yet, so build core from source.
      core_git_ref: '672247571f9b1f374a9eb17094970503c4e12137'

  # integration-p25-src:
  #   name: Integration tests (p25, core from source)
  #   uses: ./.github/workflows/integration-tests.yml
  #   with:
  #     protocol_version: '25'
  #     core_git_ref: 'master'
