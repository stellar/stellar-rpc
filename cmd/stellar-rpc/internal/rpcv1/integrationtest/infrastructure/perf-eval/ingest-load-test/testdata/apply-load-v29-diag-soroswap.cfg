# apply-load.cfg — rendered by gen-synthetic.sh 2026-10-02T01:14:04Z
# profile=rpcv1-soroswap family=R flagcfg=c1
# meta.xdr = setup ledgers + APPLY_LOAD_NUM_LEDGERS benchmark ledgers at the end.
APPLY_LOAD_MODE = "benchmark"
APPLY_LOAD_MODEL_TX = "soroswap"

# Meta output: the meta stream is the dataset.
METADATA_OUTPUT_STREAM = "meta.xdr"
METADATA_DEBUG_LEDGERS = 0

# Meta flags: flag config c1
ENABLE_SOROBAN_DIAGNOSTIC_EVENTS = true
ENABLE_DIAGNOSTICS_FOR_TX_SUBMISSION = true
EMIT_CLASSIC_EVENTS = true
EMIT_SOROBAN_TRANSACTION_META_EXT_V1 = true
BACKFILL_RESTORE_META = true

# Profile
APPLY_LOAD_MAX_SOROBAN_TX_COUNT = 250
APPLY_LOAD_NUM_LEDGERS = 1000
APPLY_LOAD_LEDGER_MAX_DEPENDENT_TX_CLUSTERS = 4
APPLY_LOAD_CLASSIC_TXS_PER_LEDGER = 1000
GENESIS_TEST_ACCOUNT_COUNT = 21000

# Perf hygiene
APPLY_LOAD_TIME_WRITES = true
DISABLE_SOROBAN_METRICS_FOR_TESTING = true

# Bucket-list pre-generation off (not needed in benchmark mode)
APPLY_LOAD_BL_SIMULATED_LEDGERS = 0
APPLY_LOAD_BL_WRITE_FREQUENCY = 0
APPLY_LOAD_BL_BATCH_SIZE = 0
APPLY_LOAD_BL_LAST_BATCH_SIZE = 0
APPLY_LOAD_BL_LAST_BATCH_LEDGERS = 0

# Boilerplate
ARTIFICIALLY_GENERATE_LOAD_FOR_TESTING = true
UNSAFE_QUORUM = true
HTTP_PORT = 0
NETWORK_PASSPHRASE = "Apply Load"
NODE_SEED = "SDQVDISRYN2JXBS7ICL7QJAEKB3HWBJFP2QECXG7GZICAHBK4UNJCWK2 self"
LOG_FILE_PATH = ""

[QUORUM_SET]
THRESHOLD_PERCENT = 100
VALIDATORS = ["$self"]

# Local history for the setup ledgers before the benchmark.
[HISTORY.local]
get = "cp -r history/{0} {1}"
put = "cp -r {0} history/{1}"
mkdir = "mkdir -p history/{0}"
