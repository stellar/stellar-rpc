[workspace]
resolver = "2"
members = ["cmd/stellar-rpc/lib/preflight", "cmd/stellar-rpc/lib/ffi", "cmd/stellar-rpc/lib/xdr2json"]

[workspace.package]
rust-version = "1.79.0"

[workspace.dependencies]
base64 = "0.22.0"
sha2 = "0.10.7"
libc = "0.2.147"
anyhow = "1.0.75"
serde_json = "1.0"

# `-prev` is core's protocol-29 stand-in: 29 was an internal security release,
# never GA'd on crates.io, so it's pinned by git rev like `-curr`. This must be
# the same rev core's own p29 host pins (src/rust/Cargo.toml
# soroban-env-host-p29), not just any 29.0.0 commit.
[workspace.dependencies.soroban-env-host-prev]
package = "soroban-env-host"
version = "=29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "a721944b5a4ea830a4bf5c2dbb8dbe8c1e1354c5"

# `-curr` is rs-soroban-env#1737 (CAP-0087 ML-DSA host functions), which also
# carries CAP-0084's muxed contract addresses (#1700). It declares protocol 30
# by default, so no `next` feature is needed.
[workspace.dependencies.soroban-env-host-curr]
package = "soroban-env-host"
version = "=30.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "f5a9fb79fd9134d9a0573f8b8ed72cb6b716d422"

[workspace.dependencies.soroban-simulation-prev]
package = "soroban-simulation"
git = "https://github.com/stellar/rs-soroban-env"
rev = "a721944b5a4ea830a4bf5c2dbb8dbe8c1e1354c5"

[workspace.dependencies.soroban-simulation-curr]
package = "soroban-simulation"
git = "https://github.com/stellar/rs-soroban-env"
rev = "f5a9fb79fd9134d9a0573f8b8ed72cb6b716d422"
features = ["unstable-next-api"]

[workspace.dependencies.stellar-xdr]
# Must match soroban-env-host-curr's own rs-stellar-xdr pin, or Cargo treats
# them as two separate crate instances and type unification with the host
# breaks.
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "a9c9750e4a24473323f550b5184742975d6419f4"
# `type_enum` provides the `Type`/`TypeVariant` reflection enums used by
# xdr2json. `cap_0084_muxed_contract` gates the `ScAddress` muxed-contract arm;
# `cap_0087_ml_dsa` gates the ContractCostType 86-94 cost-type entries used by
# v30 cost-params decoding. Both are the same feature set soroban-env-host-curr
# enables at its workspace level, so xdr2json's reflection and the curr host
# resolve to the same stellar-xdr feature set.
features = ["serde", "type_enum", "cap_0084_muxed_contract", "cap_0087_ml_dsa"]

[workspace.dependencies.rand]
version = "0.8.5"
features = []

[profile.release-with-panic-unwind]
inherits = "release"
panic = "unwind"
