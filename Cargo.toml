[workspace]
resolver = "2"
members = ["cmd/stellar-rpc/lib/preflight", "cmd/stellar-rpc/lib/ffi", "cmd/stellar-rpc/lib/xdr2json"]

[workspace.package]
rust-version = "1.79.0"

[workspace.dependencies]
base64 = "0.22.0"
sha2 = "0.10.7"
libc = "0.2.147"
anyhow = "1.0.75"
serde_json = "1.0"

# Keep each host's `version` line directly after `package`:
# scripts/check-dependencies.bash reads the protocol from it.
[workspace.dependencies.soroban-env-host-prev]
package = "soroban-env-host"
version = "=29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "a721944b5a4ea830a4bf5c2dbb8dbe8c1e1354c5"

# TODO: repin the curr host and stellar-xdr to rs-soroban-env 6e6c4a87, the p30
# host in stellar-core 30.0.0.
[workspace.dependencies.soroban-env-host-curr]
package = "soroban-env-host"
version = "=30.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "8abed902b850b7c1aebddf131a6521684231bb93"

[workspace.dependencies.soroban-simulation-prev]
package = "soroban-simulation"
git = "https://github.com/stellar/rs-soroban-env"
rev = "a721944b5a4ea830a4bf5c2dbb8dbe8c1e1354c5"

[workspace.dependencies.soroban-simulation-curr]
package = "soroban-simulation"
git = "https://github.com/stellar/rs-soroban-env"
rev = "8abed902b850b7c1aebddf131a6521684231bb93"
features = ["unstable-next-api"]

[workspace.dependencies.stellar-xdr]
# The rs-stellar-xdr commit soroban-env-host-curr pins.
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "28f34cf5a963e3cb13a25456eb9bbda7e0e1ad64"
# `type_enum` provides the `Type`/`TypeVariant` reflection enums used by
# xdr2json. It was enabled by default in stellar-xdr v26 but is opt-in since
# v27.
features = ["serde", "type_enum"]

[workspace.dependencies.rand]
version = "0.8.5"
features = []

[profile.release-with-panic-unwind]
inherits = "release"
panic = "unwind"
