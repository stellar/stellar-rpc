[workspace]
resolver = "2"
members = ["cmd/stellar-rpc/lib/preflight", "cmd/stellar-rpc/lib/ffi", "cmd/stellar-rpc/lib/xdr2json"]

[workspace.package]
rust-version = "1.79.0"

[workspace.dependencies]
base64 = "0.22.0"
sha2 = "0.10.7"
libc = "0.2.147"
anyhow = "1.0.75"
serde_json = "1.0"

[workspace.dependencies.soroban-env-host-prev]
package = "soroban-env-host"
version = "=28.0.1"

# Shift the window: `-prev` is now the released P28 host (crates.io 28.0.1),
# and `-curr` is the CAP-0087 host pulled from the (unmerged) rs-soroban-env
# PR, declaring P30 with `next`. Using a git rev keeps -prev and -curr as
# separate compilation units. Bump the rev as the PR evolves; re-pin to a
# crates.io release once it merges and GAs.
[workspace.dependencies.soroban-env-host-curr]
package = "soroban-env-host"
git = "https://github.com/sisuresh/rs-soroban-env"
rev = "d3e8ed2333e902477b5c05fcd2644fd3e9d7b752"
features = ["next"]

[workspace.dependencies.soroban-simulation-prev]
package = "soroban-simulation"
version = "=28.0.1"

[workspace.dependencies.soroban-simulation-curr]
package = "soroban-simulation"
git = "https://github.com/sisuresh/rs-soroban-env"
rev = "d3e8ed2333e902477b5c05fcd2644fd3e9d7b752"
features = ["unstable-next-api"]

[workspace.dependencies.stellar-xdr]
# Use the canonical URL, not the sisuresh/rs-stellar-xdr fork: this rev is
# fetchable from stellar/rs-stellar-xdr too (GitHub shares fork object
# storage), and soroban-env-host-curr's own Cargo.toml pins that same
# canonical URL — a different URL for the same rev makes Cargo treat them as
# two separate crate instances and breaks type unification with the host.
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "f1b0285df1a0cac98aee0ba627c03f307c622cf2"
# `type_enum` provides the `Type`/`TypeVariant` reflection enums used by
# xdr2json. `cap_0087_ml_dsa` gates the CAP-0087 ContractCostType additions
# (86-94) and is the same feature soroban-env-host-curr enables internally —
# must match verbatim so xdr2json's reflection and the curr host resolve to
# the same stellar-xdr feature set.
features = ["serde", "type_enum", "cap_0087_ml_dsa"]

[workspace.dependencies.rand]
version = "0.8.5"
features = []

[profile.release-with-panic-unwind]
inherits = "release"
panic = "unwind"
