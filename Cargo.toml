[workspace]
resolver = "2"
members = ["cmd/stellar-rpc/lib/preflight", "cmd/stellar-rpc/lib/ffi", "cmd/stellar-rpc/lib/xdr2json"]

[workspace.package]
rust-version = "1.79.0"

[workspace.dependencies]
base64 = "0.22.0"
sha2 = "0.10.7"
libc = "0.2.147"
anyhow = "1.0.75"
serde_json = "1.0"

[workspace.dependencies.soroban-env-host-prev]
package = "soroban-env-host"
version = "=28.0.1"

# Shift the window: `-prev` is now the released P28 host (crates.io 28.0.1),
# and `-curr` is the muxed-contract-address host pulled from the (unmerged)
# rs-soroban-env PR, declaring P30 with `next`. Using a git rev keeps -prev
# and -curr as separate compilation units. Bump the rev as the PR evolves;
# re-pin to a crates.io release once it merges and GAs.
[workspace.dependencies.soroban-env-host-curr]
package = "soroban-env-host"
git = "https://github.com/sisuresh/rs-soroban-env"
rev = "a2094aa582c75b8cdb5a08a4640e147911f31870"
features = ["next"]

[workspace.dependencies.soroban-simulation-prev]
package = "soroban-simulation"
version = "=28.0.1"

[workspace.dependencies.soroban-simulation-curr]
package = "soroban-simulation"
git = "https://github.com/sisuresh/rs-soroban-env"
rev = "a2094aa582c75b8cdb5a08a4640e147911f31870"
features = ["unstable-next-api"]

[workspace.dependencies.stellar-xdr]
# Same URL and rev as soroban-env-host-curr's own workspace pin: a different
# URL or rev for stellar-xdr makes Cargo treat them as two separate crate
# instances and breaks type unification with the host.
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "e0d289adf4ad2483a10bcc8df743126974d77301"
# `type_enum` provides the `Type`/`TypeVariant` reflection enums used by
# xdr2json. `cap_0084_muxed_contract` gates the `ScAddress` muxed-contract arm
# and is the same feature soroban-env-host-curr enables at its workspace
# level, so xdr2json's reflection and the curr host resolve to the same
# stellar-xdr feature set.
features = ["serde", "type_enum", "cap_0084_muxed_contract"]

[workspace.dependencies.rand]
version = "0.8.5"
features = []

[profile.release-with-panic-unwind]
inherits = "release"
panic = "unwind"
