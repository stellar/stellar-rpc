[workspace]
resolver = "2"
members = ["cmd/stellar-rpc/lib/preflight", "cmd/stellar-rpc/lib/ffi", "cmd/stellar-rpc/lib/xdr2json"]

[workspace.package]
rust-version = "1.79.0"

[workspace.dependencies]
base64 = "0.22.0"
sha2 = "0.10.7"
libc = "0.2.147"
anyhow = "1.0.75"
serde_json = "1.0"

# Protocol 28 GA steady state: `-prev` is the final released P27 host (for
# replaying pre-upgrade ledgers), `-curr` is the released P28 host. 28.0.1 is
# v28.0.0 (ba37ea5f — the exact commit stellar-core 28.0.0 bundles as
# src/rust/soroban/p28) plus an ed25519-dalek version-constraint fix
# (rs-soroban-env#1706); no metering change, so preflight simulation and
# apply-time metering still agree.
[workspace.dependencies.soroban-env-host-prev]
package = "soroban-env-host"
version = "=27.0.1"

[workspace.dependencies.soroban-env-host-curr]
package = "soroban-env-host"
version = "=28.0.1"

[workspace.dependencies.soroban-simulation-prev]
package = "soroban-simulation"
version = "=27.0.1"

[workspace.dependencies.soroban-simulation-curr]
package = "soroban-simulation"
version = "=28.0.1"
features = ["unstable-next-api"]

[workspace.dependencies.stellar-xdr]
version = "=28.0.0"
# `type_enum` provides the `Type`/`TypeVariant` reflection enums used by
# xdr2json. It was enabled by default in stellar-xdr v26 but is opt-in since
# v27. The former `cap_0083`/`cap_0085_executable_ref` gates are gone: both
# CAPs ship ungated in stellar-xdr 28.0.0. `serde_json` and `serde_ignored`
# provide `Type::from_json_collecting_ignored_fields`, the parsing direction
# of xdr2json.
features = ["serde", "type_enum", "serde_json", "serde_ignored"]

[workspace.dependencies.rand]
version = "0.8.5"
features = []

[profile.release-with-panic-unwind]
inherits = "release"
panic = "unwind"
